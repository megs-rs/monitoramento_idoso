[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoramento-idoso"
version = "0.3.0"
description = "Sistema de monitoramento de idosos com câmeras IP e detecção de quedas"
requires-python = ">=3.11"
dependencies = [
    "onvif-python>=0.2.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.1.0",
    "python-telegram-bot>=20.0",
    "mediapipe>=0.10.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mo-discover = "monitoramento_idoso.cli:discover_main"
mo-monitor = "monitoramento_idoso.cli:monitor_main"
mo-dashboard = "monitoramento_idoso.cli:dashboard_main"

[tool.setuptools.packages.find]
where = ["src"]
